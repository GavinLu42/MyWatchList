name: Update news and prices

on:
  schedule:
    - cron: '0 22 * * *'   # once a day, 22:00 UTC (~5-6pm ET, after US market close)
  workflow_dispatch: {}      # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run collector
        run: python scripts/collect.py

      - name: Commit updated data
        run: |
          git config user.name "news-tracker-bot"
          git config user.email "news-tracker-bot@users.noreply.github.com"
          git add data
          git diff --quiet --cached || git commit -m "Update news and prices $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
